<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
<rect width="100%" height="100%" fill="white"/>
<text x="450" y="35" text-anchor="middle" font-size="20">Recorridos agrupados con K-Means</text>
<line x1="90" y1="470" x2="810" y2="470" stroke="#333"/>
<line x1="90" y1="90" x2="90" y2="470" stroke="#333"/>
<text x="450" y="538" text-anchor="middle">Distancia (metros)</text>
<text x="22" y="280" text-anchor="middle" transform="rotate(-90 22 280)">Tiempo estimado (minutos)</text>
<circle cx="695" cy="65" r="6" fill="#2563eb"/>
<text x="710" y="70" font-size="13">Grupo 1</text>
<circle cx="695" cy="89" r="6" fill="#dc2626"/>
<text x="710" y="94" font-size="13">Grupo 2</text>
<circle cx="695" cy="113" r="6" fill="#16a34a"/>
<text x="710" y="118" font-size="13">Grupo 3</text>
<circle cx="90.0" cy="470.0" r="7.0" fill="#2563eb" fill-opacity="0.75"/>
<text x="100.0" y="470.0" font-size="10">Restaurante -&gt; Calle 1 -&gt; Calle 2</text>
<circle cx="450.0" cy="297.3" r="7.0" fill="#dc2626" fill-opacity="0.75"/>
<text x="460.0" y="297.3" font-size="10">Restaurante -&gt; Calle 1 -&gt; Calle 3 -&gt; Calle 5</text>
<circle cx="810.0" cy="90.0" r="7.0" fill="#16a34a" fill-opacity="0.75"/>
<text x="820.0" y="90.0" font-size="10">Restaurante -&gt; Calle 1 -&gt; Calle 2 -&gt; Calle 4 -&gt; Cliente</text>
<text x="450" y="540" text-anchor="middle" font-size="11">El tamaño de cada punto representa la cantidad de pedidos.</text>
</svg>